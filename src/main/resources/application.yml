server:
  port: ${PORT:8090}
  shutdown: graceful

spring:
  application:
    name: cafe-qr-ai
  threads:
    virtual:
      enabled: true # chat answers stream on virtual threads

  # Own schema "ai" in the existing PostgreSQL server; nothing here touches the POS tables.
  datasource:
    url: ${AI_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cafeqr_db}
    username: ${AI_DATASOURCE_USERNAME:postgres}
    password: ${AI_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${AI_DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai
  flyway:
    schemas: ai
    default-schema: ai
    create-schemas: true

  # ---- AI model for the built-in chat ------------------------------------------------------------------
  # Pick the provider with AI_PROVIDER: ollama (free, local, dev) | anthropic (production) | openai
  # "openai" also covers any OpenAI-compatible API (Gemini, Groq, OpenRouter...) via AI_OPENAI_BASE_URL.
  # Never send real café data to a free tier that trains on inputs.
  ai:
    model:
      chat: ${AI_PROVIDER:ollama}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}
          temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
          max-tokens: 1024
          temperature: 0.2
    openai:
      api-key: ${AI_OPENAI_API_KEY:not-set}
      base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

cafeqr:
  ai:
    backend:
      base-url: ${CAFEQR_BACKEND_URL:http://localhost:8080}
      connect-timeout-ms: 3000
      read-timeout-ms: 20000
    security:
      # Base64 X.509 public key of cafe-qr-backend (same value as its JWT_PUBLIC_KEY).
      # Leave empty to fetch it from the backend's /api/v1/public/ai/jwt-public-key.
      jwt-public-key: ${CAFEQR_JWT_PUBLIC_KEY:}
      allowed-roles: ${AI_ALLOWED_ROLES:SUPER_ADMIN}
      allowed-origins: ${AI_ALLOWED_ORIGINS:http://localhost:3000,https://*.cafeqr.in}
    limits:
      monthly-questions-per-client: ${AI_MONTHLY_QUESTIONS:300}
      requests-per-minute-per-client: ${AI_REQUESTS_PER_MINUTE:60}
      max-rows: 50
      max-range-days: 366
    assistant:
      history-messages: 10
      max-message-chars: 1000
      model: ${AI_PROVIDER:ollama}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    cafeqr.ai.audit: INFO
